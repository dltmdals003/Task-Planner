name: Docker CD

on:
  workflow_run:
    workflows:
      - Docker CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: task-planner-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/task-planner
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - windows
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check out deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false

      - name: Pull verified image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          docker pull "${env:IMAGE_NAME}:${env:IMAGE_TAG}"
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed with exit code $LASTEXITCODE" }

      - name: Blue-green deploy and verify
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\deploy\Deploy-BlueGreen.ps1" `
            -Image "$env:IMAGE_NAME" `
            -ImageTag "$env:IMAGE_TAG" `
            -SupabaseUrl "$env:SUPABASE_URL" `
            -SupabasePublishableKey "$env:SUPABASE_PUBLISHABLE_KEY"
          if ($LASTEXITCODE -ne 0) { throw "blue-green deployment failed with exit code $LASTEXITCODE" }

      - name: Write deployment summary
        if: always()
        shell: powershell
        run: |
          $summary = @"
          ## Docker CD
          - Runner: Windows self-hosted
          - Image: ``$env:IMAGE_NAME``
          - Tag: ``$env:IMAGE_TAG``
          - Strategy: Blue-green with Nginx graceful reload
          - Public URL: http://localhost:8080
          - Source CI run: ${{ github.event.workflow_run.html_url }}
          "@
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary + [Environment]::NewLine, $utf8)
