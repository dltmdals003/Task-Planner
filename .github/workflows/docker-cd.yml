name: Docker CD
on:
  workflow_run:
    workflows: [Docker CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: task-planner-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/task-planner
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull verified image
        run: |
          docker pull "${env:IMAGE_NAME}:${env:IMAGE_TAG}"
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed: $LASTEXITCODE" }
      - name: Deploy with Blue-Green script
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\deploy\Deploy-BlueGreen.ps1" `
            -Image $env:IMAGE_NAME -ImageTag $env:IMAGE_TAG `
            -SupabaseUrl $env:VITE_SUPABASE_URL `
            -SupabasePublishableKey $env:VITE_SUPABASE_PUBLISHABLE_KEY `
            -StateDirectory (Join-Path $env:ProgramData 'TaskPlanner\deployment-state')
      - name: Write deployment summary
        if: always()
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          $summary = "## Docker CD`n- Image: ${env:IMAGE_NAME}:${env:IMAGE_TAG}`n- Result: $env:DEPLOY_STATUS`n- Endpoint: http://localhost:8080/`n"
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary, (New-Object System.Text.UTF8Encoding($false)))
