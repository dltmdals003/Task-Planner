server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type text/plain;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 200 'ok\n';
  }

  location = /version {
    default_type application/json;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files /version.json =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
