server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type text/plain;
    return 200 'ok\n';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
  location = /version {
    default_type application/json;
    add_header Cache-Control "no-store";
    alias /usr/share/nginx/html/version.json;
  }
}
